<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Лабораторная работа 6 — Калькулятор стоимости услуг</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="my.js" defer></script>
</head>
<body class="d-flex flex-column min-vh-100">

  <header class="site-header py-3 shadow-sm">
    <div class="container">
      <div class="d-flex flex-column flex-md-row align-items-center gap-3">
        <img id="logo" src="logo.png.png" alt="Логотип" width="80" height="80">
        <h1 class="site-title h2 m-0 text-center text-md-start">Лабораторная работа 6</h1>
      </div>
    </div>
  </header>

  <main class="container flex-grow-1 py-4">
    <section class="content-block calc-block p-3 p-md-4 rounded shadow-sm mx-auto">
      <h2 class="section-title pb-2 mb-4">Калькулятор стоимости услуг</h2>

      <form id="order-form" class="row g-3" novalidate>

        <div class="col-12">
          <label for="quantity" class="form-label fw-bold">Количество</label>
          <input type="text" id="quantity" name="quantity" class="form-control"
                 inputmode="numeric" autocomplete="off"
                 placeholder="Введите целое число, например 5"
                 value="1" aria-describedby="error-message">
          <div id="error-message" class="text-danger mt-1" role="alert" hidden></div>
        </div>

        <div class="col-12">
          <fieldset>
            <legend class="form-label fw-bold fs-6 mb-2">Тип услуги</legend>
            <div class="form-check">
              <input class="form-check-input" type="radio" id="service-consult"
                     name="service" value="consult" checked>
              <label class="form-check-label" for="service-consult">Консультация — 1500 ₽</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" id="service-site"
                     name="service" value="site">
              <label class="form-check-label" for="service-site">Разработка сайта — 20000 ₽</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" id="service-support"
                     name="service" value="support">
              <label class="form-check-label" for="service-support">Техподдержка — 3000 ₽</label>
            </div>
          </fieldset>
        </div>

        <div class="col-12 d-none" id="options-group">
          <label for="option" class="form-label fw-bold">Пакет услуги</label>
          <select id="option" name="option" class="form-select">
            <option value="basic">Базовый — +0 ₽</option>
            <option value="extended">Расширенный — +5000 ₽</option>
            <option value="premium">Премиум — +12000 ₽</option>
          </select>
        </div>

        <div class="col-12 d-none" id="property-group">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="urgent"
                   name="urgent" value="yes">
            <label class="form-check-label fw-bold" for="urgent">Срочное выполнение — +2000 ₽</label>
          </div>
        </div>

        <div class="col-12">
          <div id="result" class="result-box p-3 rounded" aria-live="polite"></div>
        </div>

      </form>
    </section>
  </main>

  <footer class="site-footer text-center py-4 mt-3">
    <div class="container">
      <p class="m-0">&copy; eveliwz</p>
    </div>
  </footer>

</body>
</html>
